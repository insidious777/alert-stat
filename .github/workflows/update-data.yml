name: Update alert data

on:
  schedule:
    - cron: "0 * * * *"   # погодинно — свідомо помірна частота, дивись README/scripts
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild alerts.db from raw_cache (no network)
        working-directory: scripts
        run: python fetch_alerts.py --rebuild-db-only

      - name: Incremental fetch (today + yesterday + gap-fill)
        working-directory: scripts
        run: python fetch_alerts.py

      - name: Refresh locations reference
        working-directory: scripts
        run: python locations.py

      - name: Recompute per-location stats
        working-directory: scripts
        run: python aggregate.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_cache docs/data
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "chore: update alert data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
